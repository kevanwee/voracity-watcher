name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used here; pull requests from forks never receive any.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Local model configuration
        shell: pwsh
        run: ./test/local-model.ps1
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
  confirmations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npx --yes firebase-tools@15.31.0 emulators:exec --config test/firestore-emulator.json --project demo-ica-confirmations --only firestore "npm run test:integration"
