name: Watch sites

on:
  schedule:
    # Best-effort fallback only: GitHub ran this every 4-6 hours in practice. The Apps
    # Script wake-up timer (scripts/apps-script/wake.gs) requests a run every 5 minutes.
    - cron: "*/5 * * * *"
  # Requested runs start within seconds: the wake-up timer and "Run workflow" use this.
  workflow_dispatch:
    inputs:
      test:
        description: Send a test message
        type: boolean
        default: false
      messages:
        description: Only answer waiting Telegram messages (the relay asks for this)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # only to keep this schedule enabled (see the last step)

concurrency:
  group: watch-sites
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Until the secrets are added, runs finish quietly instead of failing every 5 minutes.
      CONFIGURED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.WATCHER_OWNERS != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Setup pending
        if: env.CONFIGURED != 'true'
        run: echo "Not configured yet. Add TELEGRAM_BOT_TOKEN, FIREBASE_SERVICE_ACCOUNT and WATCHER_OWNERS (see README)."
      - uses: actions/checkout@v5
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-node@v5
        if: env.CONFIGURED == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
        if: env.CONFIGURED == 'true'
      # Logs are public: the runner prints counts only, never addresses or content.
      - run: npm run watch
        if: env.CONFIGURED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WATCHER_OWNERS: ${{ secrets.WATCHER_OWNERS }}
          WATCHER_CALENDARS: ${{ secrets.WATCHER_CALENDARS }}
          TRACK17_API_KEY: ${{ secrets.TRACK17_API_KEY }}
          WATCHER_TEST: ${{ inputs.test == true }}
          WATCHER_MESSAGES_ONLY: ${{ inputs.messages == true }}
          WATCHER_RELAY: ${{ secrets.WATCHER_RELAY }}
          WATCHER_RUNNER: cloud
      # GitHub disables schedules in public repos after 60 days without commits.
      # Re-enabling once a day keeps the watcher running.
      - name: Keep the schedule enabled
        if: always() && github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H%M)" \< "0010" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable" --silent
          fi
        env:
          GH_TOKEN: ${{ github.token }}
